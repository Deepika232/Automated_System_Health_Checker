name: CI

on:
  push:
    branches: ["**"]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          ruff check .

      - name: Run tests
  env:
    PYTHONPATH: .
  run: |
    pytest -q

      - name: Build Docker image
        run: |
          docker build -t automated-system-health-checker:ci .

